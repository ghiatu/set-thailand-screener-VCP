name: Thailand Stock Screener

on:
  schedule:
    # Runs at 10:00 UTC = 17:00 Bangkok time (after the SET market closes at 16:30 ICT)
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  screen:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed so this job can commit the results file back
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        run: python set100_screener.py --tickers-file thailand_all_tickers.csv --out thailand_screen_results.csv

      - name: Send results to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_telegram.py --results thailand_screen_results.csv

      - name: Commit results back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thailand_screen_results.csv
          git diff --quiet --cached || git commit -m "Update Thailand screen results ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push

      - name: Upload results as an artifact too
        uses: actions/upload-artifact@v4
        with:
          name: thailand-screen-results
          path: thailand_screen_results.csv
